[platformio]
default_envs = server_esp32

[env:server_esp32]
platform = espressif32 @ ^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    mlesniew/PicoMQTT @ ^1.3.0
build_flags =
    -D SERVER_SMARTPLUG_VERSION=\"R3.8.21\"
    ; MQTT publish handling, JSON decoding, and SD snapshot persistence can
    ; legitimately nest beyond Arduino's default 8 KB loopTask stack.  The
    ; ESP32 has ample RAM; use 16 KB to prevent a stack-canary reboot while a
    ; SmartPlug is connecting and sending its complete snapshot.
    -D ARDUINO_LOOP_STACK_SIZE=16384
    ; Default VSPI wiring. Override only for the target ServerSmartPlug board.
    -D SERVER_SMARTPLUG_SD_CS=5
    -D SERVER_SMARTPLUG_SD_SCK=18
    -D SERVER_SMARTPLUG_SD_MISO=19
    -D SERVER_SMARTPLUG_SD_MOSI=23
