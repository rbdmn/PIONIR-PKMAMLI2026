[platformio]
; The deployed SmartPlug now uses the external G3MB-202P SSR. Keep the former
; latching-relay images available as explicit recovery profiles, but make an
; ordinary `pio run` build the SSR product image.
default_envs = smartplug_product_32k_ssr

[env:esp07_safe]
platform = espressif8266@4.2.1
board = esp07
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D SMARTPLUG_ALLOW_RELAY_ACTUATION=0
    -D SMARTPLUG_ENABLE_BUTTON=0
    -D SMARTPLUG_ENABLE_LED=1
    -D SMARTPLUG_RELAY_PULSE_MS=50
    -D SMARTPLUG_RELAY_COOLDOWN_MS=1000
check_tool = cppcheck
; The ESP8266 toolchain's system headers cannot be parsed reliably by the
; bundled cppcheck version on Windows. Analyse project and library sources
; while excluding framework/package headers; production compilation remains
; the authoritative integration check for those packages.
check_skip_packages = true
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr

; INACTIVE — host/PC unit tests only. This is not firmware for an ESP board and
; is not required by the current SmartPlug product build.
; [env:native_protocol_tests]
; platform = native
; test_framework = unity
; test_build_src = no
; Host tests include the portable protocol header directly, not the UART driver.
; lib_ignore = SmartPlugBL0940
; build_flags =
;     -std=gnu++17

[env:esp07_rest]
extends = env:esp07_safe
; Hardware observed on this board has a 512 KB flash.  Do not select a 1 MB
; linker script: it creates images the bootloader rejects.
board_build.ldscript = eagle.flash.512k64.ld
board_upload.flash_size = 512KB
build_unflags =
    -D SMARTPLUG_ENABLE_BUTTON=0
    -D SMARTPLUG_ALLOW_RELAY_ACTUATION=0
build_flags =
    ${env:esp07_safe.build_flags}
    -D SMARTPLUG_ENABLE_LOCAL_API=1
    -D SMARTPLUG_ENABLE_BUTTON=1
    -D SMARTPLUG_ALLOW_RELAY_ACTUATION=1

; INACTIVE — legacy alias for esp07_rest. Retained only as documentation; use
; smartplug_product for the current runtime-selectable REST/MQTT firmware.
; [env:esp07_local]
; extends = env:esp07_rest

; MQTT image retains the local dashboard only for commissioning. Telemetry and
; external control use the broker configured from the local dashboard.
[env:esp07_mqtt]
extends = env:esp07_rest
lib_deps =
    knolleary/PubSubClient @ ^2.8
build_flags =
    ${env:esp07_rest.build_flags}
    -D SMARTPLUG_ENABLE_MQTT=1

; Production image: one binary with runtime-selectable REST API or MQTT mode.
; The commissioning page stores the selected mode and MQTT broker settings.
[env:smartplug_product]
extends = env:esp07_mqtt
; 230400 baud halves flash time compared with the previous 115200 setting while
; retaining margin for the ESP-07 + CH340 serial path. This affects uploader
; transport only, never the runtime UART/meter protocol.
upload_speed = 230400
; GPIO0 is shared with the ESP-07 serial boot/auto-reset circuit.  Treating it
; as a runtime long-press button can turn USB DTR/RTS activity into a false
; Wi-Fi factory reset and repeatedly interrupt the commissioning AP.  Product
; reset remains available through the authenticated app/API flow instead.
build_unflags =
    -D SMARTPLUG_ENABLE_BUTTON=1
build_flags =
    ${env:esp07_mqtt.build_flags}
    -D SMARTPLUG_RUNTIME_MODE=1
    -D SMARTPLUG_ENABLE_BUTTON=0

; Legacy-data export image. Flash this only as step 1 for an existing unit
; whose 64 KiB LittleFS energy record must be retained before moving to 32 KiB.
; It writes a CRC-checked handoff record to unused EEPROM bytes; it never
; formats or writes the legacy LittleFS volume.
[env:smartplug_migrate_64_to_32_stage]
extends = env:smartplug_product
board = nodemcuv2
build_flags =
    ${env:smartplug_product.build_flags}
    -D SMARTPLUG_LEGACY_FS_MIGRATION_STAGE=1

; Final compact filesystem image. It accepts only a verified handoff record
; produced by the stage image, initializes the 32 KiB LittleFS layout, writes
; the energy record with readback verification, then retires the handoff.
; Never upload this straight to a legacy 64 KiB-LittleFS unit with saved kWh.
[env:smartplug_product_32k]
extends = env:smartplug_product
board = nodemcuv2
board_build.ldscript = eagle.flash.512k32.ld
; Fails the build above the 466,928 B application slot and warns at 95%.
; This is build-only protection: it has no firmware-runtime or upload effect.
extra_scripts = post:tools/check_esp8266_32k_capacity.py
build_flags =
    ${env:smartplug_product.build_flags}
    -D SMARTPLUG_LITTLEFS_32K=1

; Physical SmartPlug compatibility build: same 512 KB ESP-07 flash geometry
; as the deployed unit, but with the compact 32 KB LittleFS partition.  Use
; only after the paired migration-stage image has prepared its EEPROM handoff.
[env:smartplug_product_32k_esp07]
extends = env:smartplug_product
board_build.ldscript = eagle.flash.512k32.ld
board_upload.flash_size = 512KB
extra_scripts = post:tools/check_esp8266_32k_capacity.py
build_flags =
    ${env:smartplug_product.build_flags}
    -D SMARTPLUG_LITTLEFS_32K=1

; Migration stage intentionally omits MQTT runtime code to fit the existing
; 64 KB ESP-07 app slot. It only prepares the verified energy handoff; EEPROM
; Wi-Fi, owner/member credentials, and stored MQTT configuration remain intact
; for the following 32 KB product image.
[env:smartplug_migrate_64_to_32_stage_esp07]
extends = env:esp07_rest
build_flags =
    ${env:esp07_rest.build_flags}
    -D SMARTPLUG_RUNTIME_MODE=1
    -D SMARTPLUG_ENABLE_BUTTON=0
    -D SMARTPLUG_LEGACY_FS_MIGRATION_STAGE=1

; Same SmartPlug flash layout with the NodeMCU reset/upload transport used by
; the COM7 adapter. This changes uploader metadata only, not target capacity.
[env:smartplug_migrate_64_to_32_stage_upload]
extends = env:smartplug_migrate_64_to_32_stage_esp07
board = nodemcuv2
board_build.ldscript = eagle.flash.512k64.ld
board_upload.flash_size = 512KB

[env:smartplug_product_32k_upload]
extends = env:smartplug_product_32k_esp07
board = nodemcuv2
board_build.ldscript = eagle.flash.512k32.ld
board_upload.flash_size = 512KB

; Primary hardware profile: external Omron G3MB-202P SSR controlled through
; Q3/SET1. The former dual-coil latching relay remains available through the
; explicit smartplug_product_32k* profiles above.
[env:smartplug_product_32k_ssr]
extends = env:smartplug_product_32k_esp07
build_flags =
    ${env:smartplug_product_32k_esp07.build_flags}
    -D SMARTPLUG_RELAY_MODE_SSR=1

; Same SSR application image with the COM7 NodeMCU upload transport.
[env:smartplug_product_32k_ssr_upload]
extends = env:smartplug_product_32k_ssr
board = nodemcuv2
board_build.ldscript = eagle.flash.512k32.ld
board_upload.flash_size = 512KB

; Compile-only verification of the portable migration record using the same
; ESP8266 toolchain as production. `pio test --without-uploading
; --without-testing` never accesses serial hardware.
[env:esp07_migration_compile_tests]
extends = env:esp07_safe
test_framework = unity
test_build_src = no
test_filter = test_migration

; Compile-only verification of portable reliability and credential-vault records.
; It uses the product family toolchain but never accesses a serial device.
[env:esp07_reliability_compile_tests]
extends = env:esp07_safe
test_framework = unity
test_build_src = no
test_filter = test_reliability

; Compile-only verification of the portable BL0940 protocol, metering, and
; anomaly tests.  This mirrors the other test environments: no serial port,
; upload, or energized hardware is involved.
[env:esp07_protocol_compile_tests]
extends = env:esp07_safe
test_framework = unity
test_build_src = no
test_filter = test_protocol

; Compatibility uploader profile: use NodeMCU-v2 reset/upload metadata while
; retaining the proven ESP-07 product linker layout and its 512 KB flash cap.
; This does not turn the hardware into a 4 MB NodeMCU target.
[env:smartplug_nodemcu512]
extends = env:smartplug_product
board = nodemcuv2
board_build.ldscript = eagle.flash.512k64.ld
board_upload.flash_size = 512KB

; INACTIVE — factory-only build for a new unit with per-device credentials and
; matching Wi-Fi QR label. Enable only for controlled factory provisioning.
; [env:esp07_factory]
; extends = env:smartplug_product
; Preserve the pre-existing conservative factory-programming transport.
; upload_speed = 115200
; extra_scripts = pre:tools/factory_build.py
